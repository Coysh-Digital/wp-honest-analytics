name: Release

# Tag a version and this builds the installable zip and attaches it to a GitHub
# release. The WordPress plugin directory has its own deploy job below, which
# only runs once the directory credentials are configured.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish, e.g. v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the zip
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      # On a tag push the ref is the tag. On a manual run it is whatever branch
      # the button was pressed from, which would silently produce a version
      # like "main", so the tag is asked for and used instead.
      - name: Work out the version
        id: version
        run: |
          ref="${{ inputs.tag || github.ref_name }}"
          version="${ref#v}"

          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "\"$ref\" is not a version tag. Expected something like v1.0.0." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches the plugin header
        run: |
          header="$(grep -m1 '^ \* Version:' honest-analytics.php | awk '{print $3}')"
          stable="$(grep -m1 '^Stable tag:' readme.txt | awk '{print $3}')"

          if [ "$header" != "${{ steps.version.outputs.version }}" ]; then
            echo "The tag says ${{ steps.version.outputs.version }} and the plugin header says $header." >&2
            exit 1
          fi

          if [ "$stable" != "${{ steps.version.outputs.version }}" ]; then
            echo "The tag says ${{ steps.version.outputs.version }} and readme.txt says $stable." >&2
            exit 1
          fi

      - name: Build the zip
        run: |
          mkdir -p /tmp/build/honest-analytics
          # .distignore excludes itself, so the copy the directory serves has
          # never carried it. Without this line the GitHub release does, and
          # the two zips claiming to be the same version differ.
          rsync -a --exclude '.git' --exclude '.github' --exclude '.wordpress-org' \
            --exclude 'docs' --exclude 'CONTRIBUTING.md' --exclude '.gitignore' \
            --exclude '.distignore' \
            ./ /tmp/build/honest-analytics/
          cd /tmp/build && zip -qr "honest-analytics-${{ steps.version.outputs.version }}.zip" honest-analytics

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/build/honest-analytics-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true

  directory:
    name: Deploy to the WordPress plugin directory
    runs-on: ubuntu-latest
    needs: release
    # Runs only once the directory credentials exist, so a release before the
    # plugin is accepted does not fail the whole workflow.
    if: ${{ vars.DEPLOY_TO_WORDPRESS_ORG == 'true' }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Deploys the repository root, filtered by .distignore, into both
      # trunk/ and tags/<version>/, and syncs ASSETS_DIR into the directory's
      # own assets/ folder. It also removes from SVN anything deleted here,
      # which is the step a hand-rolled svn script usually forgets.
      - name: Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: honest-analytics
          ASSETS_DIR: .wordpress-org
          BUILD_DIR: false
