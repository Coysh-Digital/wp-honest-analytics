name: Release

# Tag a version and this builds the installable zip and attaches it to a GitHub
# release. The WordPress plugin directory has its own deploy job below, which
# only runs once the directory credentials are configured.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the zip
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Work out the version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches the plugin header
        run: |
          header="$(grep -m1 '^ \* Version:' honest-analytics.php | awk '{print $3}')"
          stable="$(grep -m1 '^Stable tag:' readme.txt | awk '{print $3}')"

          if [ "$header" != "${{ steps.version.outputs.version }}" ]; then
            echo "The tag says ${{ steps.version.outputs.version }} and the plugin header says $header." >&2
            exit 1
          fi

          if [ "$stable" != "${{ steps.version.outputs.version }}" ]; then
            echo "The tag says ${{ steps.version.outputs.version }} and readme.txt says $stable." >&2
            exit 1
          fi

      - name: Build the zip
        run: |
          mkdir -p /tmp/build/honest-analytics
          rsync -a --exclude '.git' --exclude '.github' --exclude '.wordpress-org' \
            --exclude 'docs' --exclude 'CONTRIBUTING.md' --exclude '.gitignore' \
            ./ /tmp/build/honest-analytics/
          cd /tmp/build && zip -qr "honest-analytics-${{ steps.version.outputs.version }}.zip" honest-analytics

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/build/honest-analytics-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true

  directory:
    name: Deploy to the WordPress plugin directory
    runs-on: ubuntu-latest
    needs: release
    # Runs only once the directory credentials exist, so a release before the
    # plugin is accepted does not fail the whole workflow.
    if: ${{ vars.DEPLOY_TO_WORDPRESS_ORG == 'true' }}

    steps:
      - uses: actions/checkout@v5

      - name: Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: honest-analytics
          ASSETS_DIR: .wordpress-org
          BUILD_DIR: false
